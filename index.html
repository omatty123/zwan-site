<style>
  :root{
    --paper:#ffffff;
    --ink:#0f101b;
    --ink-dim:#5d5d6b;
    --red:#cd4e30;
    --orange:#d07f45;
    --yellow:#ecdb4a;
    --pink:#cc7cb4;
    --sky:#62b8ec;
    --line:#ecebe6;
    --font:"Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-variation-settings:"wdth" 100;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    gap:clamp(1.5rem,4vw,4rem);
    max-width:1320px;
    margin:0 auto;
    padding:clamp(1rem,3vw,2.5rem) clamp(1rem,3vw,2.5rem) 8rem;
  }

  /* ---- the cover, alive ---- */
  .art{position:sticky;top:clamp(1rem,3vw,2.5rem);align-self:start}
  .art svg{display:block;width:100%;height:auto;cursor:pointer}
  .art .hint{
    margin:.4rem 0 0;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
  }

  /* ---- words ---- */
  .side{padding-top:clamp(0rem,4vw,3rem);min-width:0}
  .eyebrow{
    margin:0 0 .6rem;
    font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);
  }
  h1{
    margin:0;
    font-weight:900;
    font-variation-settings:"wdth" 125;
    font-size:clamp(2rem,4.2vw,3.4rem);
    line-height:.95;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .stripes{display:flex;flex-direction:column;gap:3px;margin:1.1rem 0 1.2rem;width:9rem}
  .stripes i{display:block;height:5px;border-radius:3px}
  .intro{
    margin:0 0 1.6rem;max-width:44ch;
    font-size:15px;line-height:1.6;color:var(--ink-dim);
  }

  /* ---- download the album ---- */
  .album{
    appearance:none;border:0;cursor:pointer;font:inherit;
    display:flex;align-items:center;gap:.9rem;
    margin:0 0 1.8rem;padding:.7rem 1.2rem .7rem .8rem;
    background:var(--red);color:#fff;border-radius:6px;text-align:left;
    box-shadow:0 5px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease, background .2s;
  }
  .album:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
  .album:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .album:disabled{cursor:progress;background:var(--orange)}
  .album .z{
    font-weight:900;font-variation-settings:"wdth" 125;font-size:1.7rem;line-height:1;
    letter-spacing:-.03em;padding-right:.9rem;border-right:2px solid rgba(255,255,255,.55);
    transform:rotate(-4deg);
  }
  .album .what{display:flex;flex-direction:column}
  .album b{font-weight:800;font-size:16px}
  .album small{font-size:12px;opacity:.9;margin-top:.1rem}

  /* ---- tracklist ---- */
  .tracks{margin:0;padding:0;list-style:none;border-top:2px solid var(--ink)}
  .track{
    position:relative;
    display:grid;
    grid-template-columns:2.4rem minmax(0,1fr) auto auto;
    gap:.8rem;
    align-items:center;
    padding:.72rem .2rem;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:padding-left .25s cubic-bezier(.2,.7,.2,1);
  }
  .track:hover{padding-left:.7rem}
  .track .num{
    font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  }
  .track.playing .num{color:var(--red)}
  .track .title{min-width:0}
  .track .title b{
    display:block;font-weight:700;font-size:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .track.playing .title b{color:var(--red)}
  .track .time{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .track .dl{
    font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-dim);text-decoration:none;
    padding:.3rem .6rem;border:1px solid var(--line);border-radius:999px;
    transition:color .2s,border-color .2s;
  }
  .track .dl:hover{color:var(--red);border-color:var(--red)}

  /* progress: the cover's ribbon, drawn under the playing row */
  .track .ribbon{
    position:absolute;left:0;bottom:-1px;height:9px;width:0%;
    display:flex;flex-direction:column;gap:1px;pointer-events:none;
  }
  .track .ribbon i{flex:1;display:block}
  .track.playing .ribbon, .track.paused .ribbon{display:flex}

  .eq{display:none;gap:2px;align-items:flex-end;height:13px;margin-right:.35rem;vertical-align:-1px}
  .track.playing .eq{display:inline-flex}
  .eq i{display:block;width:3px;height:13px;border-radius:1px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(1){background:var(--red);animation-delay:0s}
  .eq i:nth-child(2){background:var(--yellow);animation-delay:.2s}
  .eq i:nth-child(3){background:var(--sky);animation-delay:.4s}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

  /* ---- dock ---- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);
    border-top:2px solid var(--ink);
  }
  .dock-inner{
    max-width:1320px;margin:0 auto;
    display:flex;align-items:center;gap:1rem;
    padding:.65rem clamp(1rem,3vw,2.5rem);
  }
  .dock img{width:48px;height:48px;display:block;flex:0 0 auto}
  .dock .btn{
    appearance:none;border:0;cursor:pointer;flex:0 0 auto;
    width:42px;height:42px;border-radius:50%;
    background:var(--red);color:#fff;display:grid;place-items:center;
  }
  .dock .btn:hover{background:var(--ink)}
  .dock .now{min-width:0;flex:0 1 16rem}
  .dock .now .t{margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
  .dock .now .n{margin:.1rem 0 0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock .pbar{
    position:relative;flex:1;height:14px;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;justify-content:center;
  }
  .dock .pbar .band{height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
  .dock .pbar .band i{position:absolute;inset:0 auto 0 0;width:0%}
  .dock .stime{flex:0 0 auto;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

  footer{max-width:1320px;margin:0 auto;padding:0 clamp(1rem,3vw,2.5rem) 7rem;font-size:12px;color:var(--ink-dim)}

  @media (max-width:860px){
    .wrap{grid-template-columns:minmax(0,1fr);gap:1rem}
    .art{position:relative;top:0}
    .side{padding-top:0}
  }
  @media (max-width:560px){
    .track{grid-template-columns:2rem minmax(0,1fr) auto;padding:.7rem 0}
    .track .time{display:none}
    .dock-inner{flex-wrap:wrap;gap:.6rem}
    .dock img{width:40px;height:40px}
    .dock .now{flex:1 1 0}
    .dock .pbar{flex:1 1 100%;order:5}
  }
  @media (prefers-reduced-motion: reduce){
    .eq i{animation:none}
    .track{transition:none}
  }
</style>

    <p class="hint">Press play and the cover moves with the music. Click it to send a ring.</p>
  </figure>

  <section class="side">
    <p class="eyebrow">Zwan &middot; 2003</p>
    <h1>Mary Star of the Sea</h1>
    <div class="stripes" aria-hidden="true">
      <i style="background:var(--pink)"></i><i style="background:var(--sky)"></i><i style="background:var(--yellow)"></i><i style="background:var(--orange)"></i>
    </div>
    <p class="intro">Fourteen songs, the band's only album. Press play on a track, or download it to keep.</p>
    <button class="album" id="albumBtn" type="button">
      <span class="z">ZWAN</span>
      <span class="what"><b id="albumLabel">Download the album</b><small id="albumSub">14 MP3s &middot; 107 MB &middot; one zip</small></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 3v13M5 10l7 7 7-7M4 21h16"/></svg>
    </button>
    <ul class="tracks" id="tracks"></ul>
  </section>
</div>

<footer>Zwan &middot; <em>Mary Star of the Sea</em> &middot; Reprise, 2003</footer>

<div class="dock">
  <div class="dock-inner">
    <img src="cover.jpg" alt="" width="48" height="48">
    <button class="btn" id="dockBtn" type="button" aria-label="Play">
      <svg id="dockIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
    </button>
    <div class="now">
      <p class="t" id="nowLabel">Ready</p>
      <p class="n" id="nowTitle">Press play</p>
    </div>
    <div class="pbar" id="pbar" aria-hidden="true">
      <span class="band"><i style="background:var(--pink)"></i></span>
      <span class="band"><i style="background:var(--sky)"></i></span>
      <span class="band"><i style="background:var(--yellow)"></i></span>
    </div>
    <span class="stime" id="dockTime">0:00 / 0:00</span>
  </div>
</div>

<audio id="player" preload="metadata"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
const SONGS = [
  {n:"01", t:"Lyric",  f:"01-lyric.mp3", d:"3:17"},
  {n:"02", t:"Settle Down", f:"02-settle-down.mp3", d:"5:24"},
  {n:"03", t:"Declarations of Faith", f:"03-declarations-of-faith.mp3", d:"4:17"},
  {n:"04", t:"Honestly", f:"04-honestly.mp3", d:"3:46"},
  {n:"05", t:"El Sol", f:"05-el-sol.mp3", d:"3:38"},
  {n:"06", t:"Of a Broken Heart", f:"06-of-a-broken-heart.mp3", d:"3:52"},
  {n:"07", t:"Ride a Black Swan", f:"07-ride-a-black-swan.mp3", d:"4:53"},
  {n:"08", t:"Heartsong", f:"08-heartsong.mp3", d:"3:08"},
  {n:"09", t:"Endless Summer", f:"09-endless-summer.mp3", d:"4:22"},
  {n:"10", t:"Baby Let's Rock!", f:"10-baby-lets-rock.mp3", d:"3:41"},
  {n:"11", t:"Yeah!", f:"11-yeah.mp3", d:"3:06"},
  {n:"12", t:"Desire", f:"12-desire.mp3", d:"4:14"},
  {n:"13", t:"Jesus, I / Mary Star of the Sea", f:"13-jesus-i.mp3", d:"14:04"},
  {n:"14", t:"Come With Me", f:"14-come-with-me.mp3", d:"4:01"}
];

const C = {red:"#cd4e30", orange:"#d07f45", yellow:"#ecdb4a", pink:"#cc7cb4", sky:"#62b8ec", ink:"#0f101b", white:"#ffffff"};

/* =========================================================
   Player
   ========================================================= */
const list = document.getElementById('tracks');
const player = document.getElementById('player');
const nowTitle = document.getElementById('nowTitle');
const nowLabel = document.getElementById('nowLabel');
const dockTime = document.getElementById('dockTime');
const dockBtn = document.getElementById('dockBtn');
const dockIcon = document.getElementById('dockIcon');
const bandFills = [...document.querySelectorAll('#pbar .band i')];
let current = -1;

const PLAY = '<path d="M7 4v16l13-8z"/>';
const PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

function fmt(s){
  if(!isFinite(s)) return "0:00";
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ":" + String(r).padStart(2,"0");
}

SONGS.forEach((s, i) => {
  const li = document.createElement('li');
  li.className = "track";
  li.innerHTML = `
    <span class="num"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="nn">${s.n}</span></span>
    <span class="title"><b>${s.t}</b></span>
    <span class="time">${s.d}</span>
    <a class="dl" href="audio/${s.f}" download title="Download ${s.t}">&darr; mp3</a>
    <span class="ribbon" aria-hidden="true"><i style="background:${C.pink}"></i><i style="background:${C.sky}"></i><i style="background:${C.yellow}"></i></span>
  `;
  li.setAttribute('role','button');
  li.setAttribute('tabindex','0');
  li.setAttribute('aria-label','Play ' + s.t);
  li.addEventListener('click', (e) => { if (!e.target.closest('a')) toggle(i); });
  li.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('a')){ e.preventDefault(); toggle(i); } });
  list.appendChild(li);
});

function row(i){ return list.children[i]; }

function toggle(i){
  Art.wake();
  if (current === i){
    if (player.paused) player.play().catch(()=>{}); else player.pause();
    return;
  }
  current = i;
  player.src = 'audio/' + SONGS[i].f;
  player.play().catch(()=>{});
  paintRows();
}

dockBtn.addEventListener('click', () => toggle(current < 0 ? 0 : current));

document.getElementById('pbar').addEventListener('click', (e) => {
  if (current < 0 || !player.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  player.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * player.duration;
});

function paintRows(){
  for (let i = 0; i < SONGS.length; i++){
    const r = row(i);
    const on = i === current;
    r.classList.toggle('playing', on && !player.paused);
    r.classList.toggle('paused', on && player.paused);
    if (!on) r.querySelector('.ribbon').style.width = "0%";
    r.setAttribute('aria-label', (on && !player.paused ? "Pause " : "Play ") + SONGS[i].t);
  }
  if (current >= 0){
    nowTitle.textContent = SONGS[current].t;
    nowLabel.textContent = (player.paused ? "Paused · " : "Now playing · ") + SONGS[current].n;
  }
  dockIcon.innerHTML = (current >= 0 && !player.paused) ? PAUSE : PLAY;
  dockBtn.setAttribute('aria-label', (current >= 0 && !player.paused) ? "Pause" : "Play");
}

/* ---- download the album: fetch the fourteen files, zip them here, save ---- */
const albumBtn = document.getElementById('albumBtn');
const albumLabel = document.getElementById('albumLabel');
const albumSub = document.getElementById('albumSub');
albumBtn.addEventListener('click', async () => {
  if (!window.JSZip){ location.href = 'audio/' + SONGS[0].f; return; }
  albumBtn.disabled = true;
  try {
    const zip = new JSZip();
    const dir = zip.folder('ZWAN - Mary Star of the Sea');
    for (let i = 0; i < SONGS.length; i++){
      albumLabel.textContent = `Gathering songs ${i + 1} of ${SONGS.length}`;
      albumSub.textContent = SONGS[i].t;
      const r = await fetch('audio/' + SONGS[i].f);
      if (!r.ok) throw new Error(SONGS[i].f);
      dir.file(SONGS[i].f, await r.arrayBuffer());
    }
    albumLabel.textContent = 'Wrapping it up';
    albumSub.textContent = 'one moment';
    const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ZWAN - Mary Star of the Sea.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    albumLabel.textContent = 'Downloaded';
    albumSub.textContent = 'check your downloads folder';
  } catch (e) {
    albumLabel.textContent = 'That didn\'t work';
    albumSub.textContent = 'try again, or save songs one by one below';
  }
  setTimeout(() => { albumBtn.disabled = false; albumLabel.textContent = 'Download the album'; albumSub.textContent = '14 MP3s · 107 MB · one zip'; }, 6000);
});

player.addEventListener('play', paintRows);
player.addEventListener('pause', paintRows);
player.addEventListener('ended', () => {
  if (current < SONGS.length - 1){ toggle(current + 1); }
  else { current = -1; player.removeAttribute('src'); paintRows(); nowLabel.textContent = "Ready"; nowTitle.textContent = "Press play"; dockTime.textContent = "0:00 / 0:00"; bandFills.forEach(b => b.style.width = "0%"); }
});
player.addEventListener('timeupdate', () => {
  if (current < 0) return;
  const p = player.duration ? (player.currentTime / player.duration) : 0;
  row(current).querySelector('.ribbon').style.width = (p * 100) + "%";
  bandFills.forEach(b => b.style.width = (p * 100) + "%");
  dockTime.textContent = fmt(player.currentTime) + " / " + fmt(player.duration);
});
paintRows();

/* =========================================================
   Audio level. Real analyser when served over http(s).
   On file:// Chrome taints the source and would mute it,
   so there we fall back to a steady pulse instead.
   ========================================================= */
const Level = (() => {
  let ctx, an, buf, live = false;
  // iPhone and iPad suspend Web Audio when the screen locks, which would stop the music,
  // so there the cover follows a steady pulse instead of the real signal
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const canAnalyse = !iOS && location.protocol !== 'file:' && (window.AudioContext || window.webkitAudioContext);
  function init(){
    if (ctx || !canAnalyse) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(player);
      an = ctx.createAnalyser();
      an.fftSize = 512;
      an.smoothingTimeConstant = .78;
      src.connect(an); an.connect(ctx.destination);
      buf = new Uint8Array(an.frequencyBinCount);
      live = true;
    } catch(e){ live = false; }
  }
  player.addEventListener('play', () => { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); });
  return {
    read(t){
      if (player.paused || current < 0) return {bass:0, mid:0, high:0, on:false};
      if (live){
        an.getByteFrequencyData(buf);
        const avg = (a,b) => { let s=0; for (let i=a;i<b;i++) s+=buf[i]; return s/((b-a)*255); };
        return {bass:avg(1,8), mid:avg(8,48), high:avg(48,140), on:true};
      }
      const beat = Math.pow(Math.max(0, Math.sin(t*Math.PI*2*1.05)), 6);
      return {bass:.35 + .45*beat, mid:.4 + .15*Math.sin(t*1.7), high:.3 + .1*Math.sin(t*3.1), on:true};
    }
  };
})();

/* =========================================================
   The cover, traced from a scan of the sleeve. Each part
   (letters, bird, star, target) is its own layer so it can move.
   ========================================================= */
const Art = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('art');
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bird = $('bird'), letters = $('letters'), star = $('star'), target = $('target');
  const revealC = $('revealC'), sheen = $('sheen'), ripples = $('ripples');
  const wing = $('wing'), flow = $('flow'), flowP = $('flowP');
  const PIVOT = [440, 790];                  // where the wing meets the body
  const TX = 223, TY = 1250;                 // centre of the target
  const RING = ['#62b8ec', '#d07f45', '#cc7cb4', '#ecdb4a'];
  let t0 = performance.now(), lastT = 0, raf = 0, flowShift = 0;
  let flapPhase = 0;
  let bass = 0, lastBass = 0, sinceHit = 9, sinceRipple = 0, sinceSheen = 3, sheenAt = -1, nRipple = 0;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const span = (t, a, b) => ease((t - a) / (b - a));

  function ripple(){
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', TX); c.setAttribute('cy', TY); c.setAttribute('fill', 'none');
    c.setAttribute('stroke', RING[nRipple++ % RING.length]);
    c.dataset.born = lastT;
    ripples.appendChild(c);
  }
  function startSheen(t){ sheenAt = t; sinceSheen = 0; }

  function frame(now){
    const t = (now - t0) / 1000;
    const dt = Math.min(.1, t - lastT); lastT = t;
    const L = Level.read(t);
    bass += ((L.on ? L.bass : 0) - bass) * .25;

    // the cover assembles itself once, then settles
    const sun = span(t, .15, 1.5);
    revealC.setAttribute('r', 1400 * sun);
    const tg = span(t, .05, .75);
    const bt = span(t, .5, 1.8);               // the bird glides in first
    const lt = span(t, 1.6, 2.1);              // then the letters land behind it
    letters.setAttribute('transform', `translate(900 380) scale(${1.08 - .08 * lt}) translate(-900 -380)`);
    letters.setAttribute('opacity', lt);
    const st = span(t, 1.2, 1.9);

    // idle motion: slow, small, and on the cover's own terms
    // wings: slow, steady beats, up and down; the body lifts a little on each downstroke
    flapPhase += dt / (L.on ? 2.3 : 2.8);
    const f = (1 - Math.cos(flapPhase * Math.PI * 2)) / 2;      // 0 = wing up, 1 = wing down
    wing.setAttribute('transform',
      `translate(${PIVOT[0]} ${PIVOT[1]}) rotate(${-6 + f * 38}) scale(1 ${1 - f * .2}) translate(${-PIVOT[0]} ${-PIVOT[1]})`);

    const bx = (1 - bt) * -700, by = (1 - bt) * 320 + 5 - f * 12;
    const br = (1 - bt) * -10 + Math.sin(flapPhase * Math.PI * 2 - 1) * .8;
    bird.setAttribute('transform', `translate(${bx} ${by}) rotate(${br} 420 700)`);

    // the rainbows: light drifting slowly along them, swelling and fading all the time
    flowShift += dt * 28;
    flowP.setAttribute('patternTransform', `rotate(-24) translate(${flowShift % 260} 0)`);
    const swell = .25 + .75 * (1 - Math.cos(t / 4.5 * Math.PI * 2)) / 2;
    flow.setAttribute('opacity', span(t, 1.6, 2.6) * Math.min(1, swell * (1 + bass * .3)));

    const beat = 1 + bass * .05;
    target.setAttribute('transform', `translate(${TX} ${TY}) scale(${tg * beat}) translate(${-TX} ${-TY})`);
    star.setAttribute('transform', `translate(1014 795) rotate(${t * 12}) scale(${st * (1 + Math.sin(t * 2) * .08 + bass * .25)}) translate(-1014 -795)`);

    // beats send a ring out of the target and light down the ribbons
    sinceHit += dt; sinceRipple += dt; sinceSheen += dt;
    if (L.on && L.bass - lastBass > .06 && sinceHit > .45){
      sinceHit = 0; ripple();
      if (sinceSheen > 2.2) startSheen(t);
    }
    lastBass = L.on ? L.bass : 0;
    if (!L.on && t > 2.4){
      if (sinceRipple > 3.2){ sinceRipple = 0; ripple(); }
      if (sinceSheen > 7) startSheen(t);
    }
    for (const c of [...ripples.children]){
      const a = (t - +c.dataset.born) / 1.8;
      if (a >= 1){ c.remove(); continue; }
      c.setAttribute('r', 126 + ease(a) * 230);
      c.setAttribute('stroke-width', 14 * (1 - a) + 1);
      c.setAttribute('opacity', (1 - a) * .9);
    }
    if (sheenAt >= 0){
      const a = (t - sheenAt) / 1.7;
      if (a >= 1){ sheenAt = -1; sheen.setAttribute('opacity', 0); }
      else {
        sheen.setAttribute('opacity', 1);
        sheen.setAttribute('transform', `translate(${-600 + ease(a) * 2700} 0) rotate(18 900 900)`);
      }
    }
    raf = requestAnimationFrame(frame);
  }

  svg.addEventListener('click', () => { ripple(); startSheen(lastT); });

  if (reduce){
    revealC.setAttribute('r', 1400);   // the cover, still
  } else {
    raf = requestAnimationFrame(frame);
  }
  return { wake(){} };
})();

</script>
